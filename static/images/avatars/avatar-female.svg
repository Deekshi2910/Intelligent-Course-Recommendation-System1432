<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Background Circle -->
  <defs>
    <linearGradient id="bgGradFem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="shirtGradFem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A0D6"/>
      <stop offset="100%" stop-color="#087FE5"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="64" fill="url(#bgGradFem)"/>

  <!-- Back Hair Droop -->
  <path d="M36 50 C30 75, 34 100, 38 108 C42 108, 46 95, 46 80 Z" fill="#3B261D"/>
  <path d="M92 50 C98 75, 94 100, 90 108 C86 108, 82 95, 82 80 Z" fill="#3B261D"/>

  <!-- Female Shoulders / Collegiate Cardigan -->
  <path d="M24 128 C26 100, 42 88, 64 88 C86 88, 102 100, 104 128 Z" fill="url(#shirtGradFem)"/>
  <!-- Inner Blouse / V-neck -->
  <polygon points="64,90 54,102 64,118 74,102" fill="#FFFFFF"/>
  <circle cx="64" cy="100" r="2" fill="#087FE5"/>

  <!-- Neck -->
  <rect x="55" y="68" width="18" height="24" rx="4" fill="#FCE0C7"/>
  <!-- Neck shadow -->
  <path d="M55 76 C59 82, 69 82, 73 76 L73 80 C69 86, 59 86, 55 80 Z" fill="#E8BD9B"/>

  <!-- Head Base -->
  <ellipse cx="64" cy="56" rx="20" ry="24" fill="#FDE7D3"/>
  <!-- Ears -->
  <ellipse cx="44" cy="56" rx="3.5" ry="5.5" fill="#FCE0C7"/>
  <ellipse cx="84" cy="56" rx="3.5" ry="5.5" fill="#FCE0C7"/>
  <!-- Small Pearl Earrings -->
  <circle cx="44" cy="60" r="1.5" fill="#FFFFFF"/>
  <circle cx="84" cy="60" r="1.5" fill="#FFFFFF"/>

  <!-- Front Hair Style (Professional side-parted bob) -->
  <path d="M38 52 C38 28, 50 20, 64 20 C78 20, 90 28, 90 52 C90 64, 85 70, 83 72 C80 62, 80 50, 78 44 C72 38, 54 38, 44 48 C41 58, 41 68, 38 72 C37 70, 38 60, 38 52 Z" fill="#4A3328"/>
  <path d="M42 42 C48 30, 60 26, 76 26 C85 26, 88 32, 89 42 C82 34, 72 32, 60 32 C50 32, 45 36, 42 42 Z" fill="#2E1D15"/>

  <!-- Eyebrows -->
  <path d="M49 47 Q54 44 58 46" stroke="#3B261D" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M70 46 Q74 44 79 47" stroke="#3B261D" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Eyes with subtle lashes -->
  <circle cx="53" cy="53" r="2.6" fill="#1F2937"/>
  <circle cx="75" cy="53" r="2.6" fill="#1F2937"/>
  <circle cx="54" cy="52" r="0.9" fill="#FFFFFF"/>
  <circle cx="76" cy="52" r="0.9" fill="#FFFFFF"/>
  <path d="M50 51 Q53 49 56 51" stroke="#1F2937" stroke-width="1.2" fill="none"/>
  <path d="M72 51 Q75 49 78 51" stroke="#1F2937" stroke-width="1.2" fill="none"/>

  <!-- Nose -->
  <path d="M63 56 Q64 61 65 61" stroke="#E8BD9B" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- Warm Smile -->
  <path d="M56 67 Q64 74 72 67" stroke="#D95565" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- Rosy cheeks -->
  <ellipse cx="48" cy="62" rx="3.5" ry="2" fill="rgba(244, 63, 94, 0.18)"/>
  <ellipse cx="80" cy="62" rx="3.5" ry="2" fill="rgba(244, 63, 94, 0.18)"/>
</svg>
