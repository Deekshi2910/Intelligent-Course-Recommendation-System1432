{% extends "base.html" %}

{% block title %}Administrator Sign In — Course Recommendation System{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-dark text-white rounded-circle mb-3 shadow-sm" style="width: 58px; height: 58px;">
                            <i class="bi bi-shield-lock-fill fs-4"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Admin Portal</h3>
                        <p class="text-muted small">Sign in with authorized administrator credentials</p>
                        <span class="badge bg-danger-subtle text-danger border border-danger-subtle px-3 py-1 rounded-pill">
                            Restricted Access
                        </span>
                    </div>

                    <form method="POST" action="{{ url_for('admin.login') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label for="identifier" class="form-label fw-semibold small">Admin Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-fill-gear text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="identifier" name="identifier" placeholder="Enter admin username or email" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold small">Admin Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-key-fill text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Enter password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold shadow-sm mb-3">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Authenticate Administrator
                        </button>
                    </form>

                    <div class="text-center text-muted small mt-4 pt-3 border-top">
                        Are you a student? 
                        <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold text-decoration-none">Go to Student Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
