<!-- Reusable Student Dashboard Sidebar Navigation -->
<div class="dashboard-sidebar shadow-sm border-0 rounded-4 p-3 bg-white mb-4">
    <div class="text-center pb-3 border-bottom mb-3">
        <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-2 shadow-sm" style="width: 60px; height: 60px;">
            <i class="bi bi-person-fill fs-3"></i>
        </div>
        <h6 class="fw-bold mb-0 text-dark">{{ profile.full_name if profile else session.get('username') }}</h6>
        <span class="badge bg-light text-secondary border mt-1">{{ profile.roll_number if profile else 'Student' }}</span>
    </div>
    
    <nav class="nav flex-column dashboard-nav">
        <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="{{ url_for('student.dashboard') }}">
            <i class="bi bi-speedometer2"></i>Dashboard
        </a>
        <a class="nav-link {% if active_page == 'profile' %}active{% endif %}" href="{{ url_for('student.profile') }}">
            <i class="bi bi-person"></i>My Profile
        </a>
        <a class="nav-link {% if active_page == 'academic' %}active{% endif %}" href="{{ url_for('student.academic') }}">
            <i class="bi bi-mortarboard"></i>Academic Details
        </a>
        <a class="nav-link {% if active_page == 'interests' %}active{% endif %}" href="{{ url_for('student.interests') }}">
            <i class="bi bi-tags"></i>My Interests
        </a>
        <a class="nav-link {% if active_page == 'career_goals' %}active{% endif %}" href="{{ url_for('student.career_goals') }}">
            <i class="bi bi-compass"></i>Career Goals
        </a>
        <a class="nav-link {% if active_page == 'courses' %}active{% endif %}" href="{{ url_for('student.courses') }}">
            <i class="bi bi-grid-3x3-gap"></i>Explore Courses
        </a>
        <a class="nav-link {% if active_page == 'recommendations' %}active{% endif %}" href="{{ url_for('student.recommendations') }}">
            <i class="bi bi-robot"></i>AI Recommendations
        </a>
        <a class="nav-link {% if active_page == 'rule_testing' %}active{% endif %}" href="{{ url_for('student.rule_testing') }}">
            <i class="bi bi-gear-wide-connected"></i>AI Rule Testing
        </a>
        <a class="nav-link {% if active_page == 'history' %}active{% endif %}" href="{{ url_for('student.history') }}">
            <i class="bi bi-clock-history"></i>Recommendation History
        </a>
        <hr class="my-2">
        <a class="nav-link text-danger" href="{{ url_for('auth.logout') }}">
            <i class="bi bi-box-arrow-right text-danger"></i>Logout
        </a>
    </nav>
</div>
