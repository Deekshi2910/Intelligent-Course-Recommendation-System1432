{% extends "base.html" %}

{% block title %}Student Sign In — Course Recommendation System{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 56px; height: 56px;">
                            <i class="bi bi-box-arrow-in-right fs-4"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Student Sign In</h3>
                        <p class="text-muted small">Sign in to access your course recommendations and profile</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label for="identifier" class="form-label fw-semibold small">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="identifier" name="identifier" placeholder="Enter username or email" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Enter password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
                        </button>
                    </form>

                    <div class="d-flex justify-content-between align-items-center text-muted small mt-4 pt-3 border-top">
                        <div>
                            Don't have an account? 
                            <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold text-decoration-none">Register</a>
                        </div>
                        <div>
                            <a href="{{ url_for('admin.login') }}" class="text-secondary text-decoration-none">
                                <i class="bi bi-shield-lock me-1"></i>Admin Portal
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
